name: quality

# Quality and security checks for praetorian.
# Jobs run in parallel and are conditioned on modified files:
#   - docs & secrets always run (fast checks, documentation consistency and secrets);
#   - code linting, Linux Bats tests, and macOS tests run only when code has changed;
#   - workflow validation runs when .github/workflows files change;
#   - quality-gate aggregates results for branch protection rules.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same PR cancels the run still going. On main, every
# merge is checked to the end: a later merge never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'praetorian*'
              - 'lib/**'
              - 'ci/**'
              - 'tests/**'
            workflows:
              - '.github/workflows/**'

  # Always runs: secrets scan (gitleaks) across all files and doc tests.
  docs:
    name: docs & secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets check (gitleaks)
        run: ./ci/check secrets
      - name: Documentation and version tests (tests/doc.bats)
        run: |
          if command -v bats >/dev/null 2>&1; then
            bats --print-output-on-failure tests/doc.bats
          else
            # Fallback when bats is not pre-installed
            version=$(sed -nE 's/^readonly PRAETORIAN_VERSION="([^"]*)"$/\1/p' praetorian)
            readme=$(sed -n '/^## Latest release/,/^## /p' README.md | sed -nE 's/^### ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)
            changelog=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CHANGELOG.md | head -n 1)
            [ -n "${version}" ] && [ "${readme}" = "${version}" ] && [ "${changelog}" = "${version}" ]
          fi

  # Code linting & formatting: ShellCheck and shfmt.
  lint:
    name: lint & format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./ci/check lint format

  # Security and syntax validation for GitHub Actions workflows.
  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./ci/check workflows

  # Bats test suite on Linux (containerized).
  tests-linux:
    name: tests on Linux (bats)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./ci/check tests

  # Target platform: macOS tools and macOS's own /bin/bash 3.2.
  macos-bash32:
    name: tests on macOS, /bin/bash 3.2
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/macos-tests

  # Aggregator job for branch protection rules.
  # Passes if all required jobs succeed or are legitimately skipped.
  quality-gate:
    name: quality-gate
    needs: [changes, docs, lint, workflows, tests-linux, macos-bash32]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate check results
        env:
          CHANGES_RES: ${{ needs.changes.result }}
          DOCS_RES: ${{ needs.docs.result }}
          LINT_RES: ${{ needs.lint.result }}
          WORKFLOWS_RES: ${{ needs.workflows.result }}
          TESTS_LINUX_RES: ${{ needs.tests-linux.result }}
          TESTS_MACOS_RES: ${{ needs.macos-bash32.result }}
        run: |
          for res in "$CHANGES_RES" "$DOCS_RES" "$LINT_RES" "$WORKFLOWS_RES" "$TESTS_LINUX_RES" "$TESTS_MACOS_RES"; do
            if [[ "$res" == "failure" || "$res" == "cancelled" ]]; then
              echo "Error: at least one required check failed or was cancelled." >&2
              exit 1
            fi
          done
          echo "All checks passed or were skipped legitimately."
